[project]
name = "vouch"
version = "0.1.0"
description = "Match supplier invoices to ledger entries and flag audit exceptions, with a labeled benchmark."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pdfplumber>=0.11",
  "reportlab>=4.0",
  "rapidfuzz>=3.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vouch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
