name: llm-benchmark
# Runs the LLM extractor on the benchmark and commits the results.
# Needs a repository secret named ANTHROPIC_API_KEY
# (Settings -> Secrets and variables -> Actions -> New repository secret).
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model id
        default: claude-haiku-4-5
      mode:
        description: "text = send extracted text, pdf = send the PDF itself"
        type: choice
        options: [text, pdf]
        default: text
      n:
        description: Number of invoices
        default: "300"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check the key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add a repository secret named ANTHROPIC_API_KEY first."
            exit 1
          fi
      - name: Generate benchmark
        run: python -m vouch.synth.generate --n ${{ inputs.n }} --seed 7 --out data/bench
      - name: Rules baseline
        run: python -m vouch.evaluate --bench data/bench --extractor rules
      - name: LLM extractor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m vouch.evaluate --bench data/bench --extractor llm \
            --model "${{ inputs.model }}" --mode "${{ inputs.mode }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && exit 0
          git commit -m "Benchmark results: ${{ inputs.model }} (${{ inputs.mode }})"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: extractions-${{ inputs.model }}-${{ inputs.mode }}
          path: data/bench/extractions/
